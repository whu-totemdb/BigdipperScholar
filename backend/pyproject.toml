[project]
name = "bigdipper-scholar-backend-agent"
version = "0.1.0"
description = "BigDipper Scholar: multi-agent scholarly analysis and traceable multimodal evidence."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "fastmcp==3.4.2",
  "httpx>=0.27.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  "langchain-mcp-adapters==0.3.0",
  "langchain-core>=1.0",
  "mcp==1.28.0",
  "neo4j>=5.22.0",
  "pymilvus>=2.4.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
langgraph = [
  "langchain>=1.0.0",
  "langchain-openai>=0.3.0",
  "langchain-mcp-adapters>=0.3.0",
  "langgraph>=0.2.0",
  "mcp>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "prompts*"]
